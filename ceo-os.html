<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CEO OS</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{display:flex;height:100vh;overflow:hidden;font-family:'Inter','Segoe UI',system-ui,sans-serif;background:#0c0c10;color:#d9d5cc}
a{color:inherit}

/* Sidebar */
#sidebar{width:214px;flex-shrink:0;background:#0f0f15;border-right:1px solid #1d1d2a;display:flex;flex-direction:column;height:100vh;overflow-y:auto;transition:width .2s}
#sidebar.closed{width:0;overflow:hidden}
#logo{padding:18px 18px 14px;border-bottom:1px solid #1d1d2a}
#logo .name{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#b89050}
#logo .date{font-size:10px;color:#5a586a;margin-top:3px}
#year-bar{padding:14px 18px 10px;border-bottom:1px solid #1d1d2a}
#year-bar .label{font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:#5a586a;margin-bottom:7px}
#year-bar .track{background:#1d1d2a;border-radius:2px;height:2px;overflow:hidden;margin-bottom:5px}
#year-bar .fill{height:100%;background:#b89050;transition:width .5s}
#year-bar .stats{display:flex;justify-content:space-between;font-size:10px;color:#5a586a}
nav{flex:1;padding-bottom:20px}
.nav-group-label{font-size:9px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#5a586a;padding:14px 18px 4px}
.nav-item{width:100%;display:flex;align-items:center;justify-content:space-between;padding:6px 18px 6px 16px;background:transparent;border:none;border-left:2px solid transparent;cursor:pointer;text-align:left;font-family:inherit;transition:background .1s;color:#88889a;font-size:13px}
.nav-item:hover{background:#141420}
.nav-item.active{background:#b8905014;border-left-color:#b89050;color:#d9d5cc}
.nav-tag{font-size:9px;color:#5a586a;background:#1d1d2a;padding:1px 6px;border-radius:10px}
#export-btn{margin:12px 18px;padding:7px 12px;background:transparent;border:1px solid #1d1d2a;border-radius:5px;color:#5a586a;font-size:11px;font-family:inherit;cursor:pointer;width:calc(100% - 36px);text-align:left}
#export-btn:hover{border-color:#333}

/* Main */
#main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}
#header{padding:16px 32px 14px;border-bottom:1px solid #1d1d2a;display:flex;align-items:flex-start;justify-content:space-between;flex-shrink:0;gap:16px}
#menu-btn{background:none;border:none;color:#5a586a;cursor:pointer;font-size:17px;padding:0;line-height:1;flex-shrink:0;margin-top:1px}
#header h1{font-size:18px;font-weight:600;letter-spacing:-.01em;margin:0;white-space:nowrap;color:#d9d5cc}
#header-left{display:flex;flex-direction:column;min-width:0}
#header-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
#header-sub{font-size:11px;color:#5a586a;margin-top:4px;margin-left:27px;line-height:1.5}
#save-badge{font-size:11px;color:#5a586a;margin-left:4px}
#save-badge.saved{color:#4a7a5a}
#current-date{font-size:12px;color:#b89050;font-weight:500;flex-shrink:0;margin-top:2px}

/* Content */
#content{flex:1;overflow-y:auto;padding:32px 40px 80px}
#content-inner{max-width:720px;margin:0 auto}

/* Past entries */
.past-nav{margin-bottom:28px}
.past-nav .past-label{font-size:10px;color:#5a586a;letter-spacing:.08em;text-transform:uppercase;margin-bottom:8px}
.past-nav .pills{display:flex;flex-wrap:wrap;gap:6px}
.pill{padding:3px 10px;border-radius:20px;border:1px solid #1d1d2a;background:transparent;color:#5a586a;font-size:11px;cursor:pointer;font-family:inherit}
.pill:hover{border-color:#333;color:#9994a6}
.pill.active{border-color:#b89050;background:#b8905018;color:#b89050}
.pill.today{border-color:#b89050;background:#b8905018;color:#b89050}

/* Banners */
.banner{background:#b8905010;border:1px solid #b8905030;border-radius:6px;padding:10px 16px;margin-bottom:28px;display:flex;align-items:center;justify-content:space-between;font-size:12px;color:#b89050}
.banner button{font-size:11px;color:#b89050;background:none;border:none;cursor:pointer;font-family:inherit}
.empty-banner{background:#14141c;border:1px solid #1d1d2a;border-radius:8px;padding:16px 20px;margin-bottom:28px;font-size:12px;color:#5a586a;line-height:1.7}

/* Prompts */
.prompt{margin-bottom:32px}
.prompt-q{font-family:Georgia,'Times New Roman',serif;font-size:15px;color:#d9d5cc;margin-bottom:5px;line-height:1.4;font-style:italic}
.prompt-h{font-size:12px;color:#5a586a;margin-bottom:10px;line-height:1.6}
.field-wrap{position:relative}
textarea{width:100%;background:#101018;border:1px solid #1d1d2a;border-radius:6px;padding:12px 44px 12px 14px;color:#d9d5cc;font-size:14px;line-height:1.75;font-family:'Inter','Segoe UI',system-ui,sans-serif;resize:vertical;outline:none;transition:border-color .15s}
textarea:focus{border-color:#b8905055}
textarea.recording{background:#0e0e1a;border-color:#ff6b6b44}
textarea.recording.interim{color:#5a586a}
.mic-btn{position:absolute;top:8px;right:8px;width:28px;height:28px;border-radius:50%;border:none;background:#1d1d2a;color:#5a586a;cursor:pointer;font-size:13px;display:flex;align-items:center;justify-content:center}
.mic-btn.active{background:#5a1010;color:#ff7070;animation:pulse 1.4s ease-in-out infinite}
.interim-text{font-size:11px;color:#5a586a;margin-top:4px;font-style:italic;padding-left:2px}
.voice-error{font-size:11px;color:#ff7070;margin-top:4px}
@keyframes pulse{0%,100%{box-shadow:0 0 0 4px #ff6b6b18}50%{box-shadow:0 0 0 8px #ff6b6b08}}

/* Mobile */
#mob-overlay{display:none;position:fixed;inset:0;z-index:100}
#mob-overlay.open{display:flex}
#mob-bg{position:absolute;inset:0;background:#00000088}
#mob-sidebar{position:relative;z-index:1}
@media(max-width:768px){
  #sidebar{display:none}
  #mob-overlay.open #sidebar{display:flex;width:214px}
}
</style>
</head>

<script>
// ─── Data ─────────────────────────────────────────────────────────
const STORAGE_KEY = 'ceo_os_v1';

function loadData() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}'); }
  catch { return {}; }
}
function saveData(d) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(d));
}

// ─── Date helpers ─────────────────────────────────────────────────
function isoToday() { return new Date().toISOString().slice(0, 10); }
function weekKey() {
  const d = new Date(), j = new Date(d.getFullYear(), 0, 1);
  const w = Math.ceil(((d - j) / 86400000 + j.getDay() + 1) / 7);
  return `${d.getFullYear()}-W${String(w).padStart(2, '0')}`;
}
function quarterKey() {
  const d = new Date();
  return `${d.getFullYear()}-Q${Math.ceil((d.getMonth() + 1) / 3)}`;
}
function yearKey() { return String(new Date().getFullYear()); }

function fmtKey(k) {
  if (!k) return '';
  if (k.includes('-W')) { const [y, w] = k.split('-W'); return `Week ${+w}, ${y}`; }
  if (k.includes('-Q')) return k.replace('-Q', ' Q');
  if (/^\d{4}$/.test(k)) return k;
  const [y, m, d] = k.split('-');
  return `${['','Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][+m]} ${+d}, ${y}`;
}

function yearProgress() {
  const n = new Date(), day = Math.floor((n - new Date(n.getFullYear(), 0, 0)) / 86400000);
  const tot = n.getFullYear() % 4 === 0 ? 366 : 365;
  return { day, tot, pct: Math.round(day / tot * 100) };
}

// ─── State ────────────────────────────────────────────────────────
const DATED = { daily: isoToday, weekly: weekKey, quarterly: quarterKey, annual: yearKey };

const state = {
  section: 'daily',
  data: loadData(),
  dkeys: { daily: isoToday(), weekly: weekKey(), quarterly: quarterKey(), annual: yearKey() },
  voices: {}, // fieldKey -> SpeechRecognition instance
};

let saveTimer = null;
function scheduleSave() {
  const badge = document.getElementById('save-badge');
  if (badge) { badge.textContent = 'saving…'; badge.className = ''; }
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    saveData(state.data);
    if (badge) { badge.textContent = '✓ saved'; badge.className = 'saved'; }
    setTimeout(() => { if (badge) badge.textContent = ''; }, 2500);
  }, 800);
}

function getValue(sec, key) {
  if (DATED[sec]) return state.data[sec]?.[state.dkeys[sec]]?.[key] || '';
  return state.data[sec]?.[key] || '';
}

function setValue(sec, key, val) {
  if (DATED[sec]) {
    const dk = state.dkeys[sec];
    if (!state.data[sec]) state.data[sec] = {};
    if (!state.data[sec][dk]) state.data[sec][dk] = {};
    state.data[sec][dk][key] = val;
  } else {
    if (!state.data[sec]) state.data[sec] = {};
    state.data[sec][key] = val;
  }
  scheduleSave();
}

// ─── Voice ────────────────────────────────────────────────────────
const SpeechAPI = window.SpeechRecognition || window.webkitSpeechRecognition || null;

function startVoice(sec, key, ta, micBtn) {
  if (!SpeechAPI) return;
  const fieldKey = sec + '__' + key;

  // Stop if already recording
  if (state.voices[fieldKey]) {
    state.voices[fieldKey].stop();
    return;
  }

  const r = new SpeechAPI();
  r.continuous = true; r.interimResults = true; r.lang = 'en-US';
  state.voices[fieldKey] = r;

  ta.classList.add('recording');
  micBtn.classList.add('active');
  micBtn.textContent = '■';

  let interimEl = ta.parentElement.querySelector('.interim-text');
  if (!interimEl) {
    interimEl = document.createElement('div');
    interimEl.className = 'interim-text';
    ta.parentElement.appendChild(interimEl);
  }

  r.onresult = e => {
    let fin = '', int = '';
    for (let i = e.resultIndex; i < e.results.length; i++) {
      const t = e.results[i][0].transcript;
      if (e.results[i].isFinal) fin += t; else int += t;
    }
    if (fin) {
      const cur = getValue(sec, key);
      const sep = cur && !cur.endsWith(' ') && !cur.endsWith('\n') ? ' ' : '';
      const next = cur + sep + fin;
      setValue(sec, key, next);
      ta.value = next;
      interimEl.textContent = '';
    } else {
      interimEl.textContent = int;
    }
  };

  r.onerror = e => {
    const errEl = ta.parentElement.querySelector('.voice-error') || document.createElement('div');
    errEl.className = 'voice-error';
    errEl.textContent = e.error === 'not-allowed' ? 'Mic access denied — check browser permissions.' : 'Error: ' + e.error;
    ta.parentElement.appendChild(errEl);
    stopVoice(sec, key, ta, micBtn);
  };

  r.onend = () => stopVoice(sec, key, ta, micBtn);
  r.start();
}

function stopVoice(sec, key, ta, micBtn) {
  const fieldKey = sec + '__' + key;
  if (state.voices[fieldKey]) {
    try { state.voices[fieldKey].stop(); } catch(e) {}
    delete state.voices[fieldKey];
  }
  ta.classList.remove('recording');
  micBtn.classList.remove('active');
  micBtn.textContent = '🎙';
  const interimEl = ta.parentElement.querySelector('.interim-text');
  if (interimEl) interimEl.textContent = '';
}

// ─── Render ───────────────────────────────────────────────────────
function renderSidebar(el) {
  const yp = yearProgress();
  el.innerHTML = `
    <div id="logo">
      <div class="name">CEO OS</div>
      <div class="date">${new Date().toLocaleDateString('en-GB', { weekday:'long', day:'numeric', month:'long' })}</div>
    </div>
    <div id="year-bar">
      <div class="label">Year Progress</div>
      <div class="track"><div class="fill" style="width:${yp.pct}%"></div></div>
      <div class="stats"><span>Day ${yp.day} of ${yp.tot}</span><span>${yp.pct}% — ${yp.tot - yp.day} left</span></div>
    </div>
    <nav>
      ${NAV.map(g => `
        <div class="nav-group-label">${g.g}</div>
        ${g.items.map(it => `
          <button class="nav-item${state.section === it.id ? ' active' : ''}" data-id="${it.id}">
            <span>${it.l}</span>
            ${it.t ? `<span class="nav-tag">${it.t}</span>` : ''}
          </button>
        `).join('')}
      `).join('')}
    </nav>
    <button id="export-btn">↓ Export data (JSON)</button>
  `;

  el.querySelectorAll('.nav-item').forEach(btn => {
    btn.addEventListener('click', () => navigate(btn.dataset.id));
  });
  el.querySelector('#export-btn').addEventListener('click', exportData);
}

function renderHeader() {
  const m = META[state.section] || { h: state.section, s: '' };
  const isDated = !!DATED[state.section];
  document.getElementById('header-title').textContent = m.h;
  document.getElementById('header-sub').textContent = m.s;
  document.getElementById('current-date').textContent = isDated ? fmtKey(state.dkeys[state.section]) : '';
}

function renderContent() {
  const sec = state.section;
  const prompts = P[sec] || [];
  const isDated = !!DATED[sec];
  const inner = document.getElementById('content-inner');
  let html = '';

  // Past entry navigation
  if (isDated) {
    const allKeys = Object.keys(state.data[sec] || {}).sort().reverse();
    const cur = state.dkeys[sec];
    const fresh = DATED[sec]();
    if (allKeys.length > 0) {
      html += `<div class="past-nav"><div class="past-label">Past Entries</div><div class="pills">
        ${allKeys.slice(0, 8).map(k => `<button class="pill${k === cur ? ' active' : ''}" data-key="${k}">${fmtKey(k)}</button>`).join('')}
        ${cur !== fresh ? `<button class="pill today" data-key="${fresh}">→ Today</button>` : ''}
      </div></div>`;
    }
    if (cur !== fresh) {
      html += `<div class="banner"><span>Viewing past entry — ${fmtKey(cur)}</span><button data-key="${fresh}">→ ${fmtKey(fresh)}</button></div>`;
    } else if (!allKeys.includes(fresh) && prompts.length > 0) {
      const msgs = {
        daily: 'No entry for today yet. Answer the five prompts below — it takes five minutes.',
        weekly: `New week: ${fmtKey(fresh)}. Block 30 minutes and work through these prompts.`,
        quarterly: `${fmtKey(fresh)} — block two uninterrupted hours. The most important meeting of your quarter.`,
        annual: `${fmtKey(fresh)} annual review. Take a morning somewhere quiet.`,
      };
      html += `<div class="empty-banner">${msgs[sec] || ''}</div>`;
    }
  }

  // Prompts
  prompts.forEach(p => {
    const val = getValue(sec, p.k);
    html += `
      <div class="prompt">
        <div class="prompt-q">${p.q}</div>
        ${p.h ? `<div class="prompt-h">${p.h}</div>` : ''}
        <div class="field-wrap">
          <textarea rows="${p.r || 4}" data-sec="${sec}" data-key="${p.k}">${val.replace(/</g, '&lt;')}</textarea>
          ${SpeechAPI ? `<button class="mic-btn" data-sec="${sec}" data-key="${p.k}" title="Speak your answer">🎙</button>` : ''}
        </div>
      </div>
    `;
  });

  inner.innerHTML = html;

  // Wire up events
  inner.querySelectorAll('.pill, .banner button').forEach(btn => {
    btn.addEventListener('click', () => {
      if (DATED[sec]) {
        state.dkeys[sec] = btn.dataset.key;
        renderAll();
      }
    });
  });

  inner.querySelectorAll('textarea').forEach(ta => {
    ta.addEventListener('input', () => setValue(ta.dataset.sec, ta.dataset.key, ta.value));
  });

  inner.querySelectorAll('.mic-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const ta = btn.previousElementSibling;
      const fieldKey = btn.dataset.sec + '__' + btn.dataset.key;
      if (state.voices[fieldKey]) stopVoice(btn.dataset.sec, btn.dataset.key, ta, btn);
      else startVoice(btn.dataset.sec, btn.dataset.key, ta, btn);
    });
  });
}

function renderAll() {
  // Stop any active voice sessions when navigating
  Object.keys(state.voices).forEach(k => {
    try { state.voices[k].stop(); } catch(e) {}
  });
  state.voices = {};

  const sidebar = document.getElementById('sidebar');
  renderSidebar(sidebar);

  // Sync mobile sidebar
  const mobSide = document.getElementById('mob-sidebar');
  if (mobSide.children.length > 0) renderSidebar(mobSide.children[0]);

  renderHeader();
  renderContent();
}

function navigate(id) {
  state.section = id;
  document.getElementById('mob-overlay').classList.remove('open');
  renderAll();
}

// ─── Export / Import ──────────────────────────────────────────────
function exportData() {
  const blob = new Blob([JSON.stringify(state.data, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `ceo-os-${isoToday()}.json`;
  a.click();
}

// ─── Menu ─────────────────────────────────────────────────────────
document.getElementById('menu-btn').addEventListener('click', () => {
  if (window.innerWidth < 768) {
    const ov = document.getElementById('mob-overlay');
    const ms = document.getElementById('mob-sidebar');
    if (!ov.classList.contains('open')) {
      ms.innerHTML = '<div id="sidebar" style="display:flex"></div>';
      renderSidebar(ms.querySelector('#sidebar'));
    }
    ov.classList.toggle('open');
  } else {
    document.getElementById('sidebar').classList.toggle('closed');
  }
});

document.getElementById('mob-bg').addEventListener('click', () => {
  document.getElementById('mob-overlay').classList.remove('open');
});

// ─── Boot ─────────────────────────────────────────────────────────
renderAll();
</script>
